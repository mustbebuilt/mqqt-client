# Mosquitto Configuration for HydroSense IoT Project
# Enables both TCP MQTT (for Node.js/hardware) and WebSockets (for Browser)

# Global settings
allow_anonymous true

# Listener 1: Standard TCP MQTT (Port 1883)
listener 1883
protocol mqtt

# Listener 2: WebSockets MQTT (Port 9001)
listener 9001
protocol websockets
